[project]
name = "deepreefmap"
version = "1.1.0"
description = "Modular framework for semantic 3D mapping of coral reefs from videos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Jonathan Sauder" },
  { name = "Hugues Sibille", email = "hugues.sibille@epfl.ch" },
]
keywords = ["coral reefs", "semantic mapping", "3d reconstruction", "computer vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.10.0.84",
  "imageio[ffmpeg]>=2.37.3",
  "typer>=0.25.1",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.0",
  "open3d>=0.18.0",
  "transformers>=5.8.0",
  "huggingface_hub>=1.14.0",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  # Upper-bounded so the dual-API fallback in deepreefmap.camera.colmap_calibration
  # (ImageReaderOptions.single_camera vs pycolmap.CameraMode.SINGLE) stays the
  # documented contract; bump after retesting calibrate against a new major.
  "pycolmap>=4.0.4,<5.0",
  "PySide6>=6.7,<7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "tqdm>=4.67.3",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  # User-writable location for LoGeR checkpoints (see deepreefmap.paths.loger_ckpts_dir):
  # a frozen PyApp binary's install tree is read-only, so they can't live under third_party/.
  "platformdirs>=4",
]

[project.optional-dependencies]
# LoGeR upstream (https://github.com/Junyi42/LoGeR) is a research repo with no
# pyproject.toml/setup.py, so we cannot pip-install it. Instead we vendor its
# `loger` namespace package into our wheel (see [tool.setuptools.packages.find-namespace])
# so it ships inside the frozen PyApp binary. This extra pulls in LoGeR's *runtime*
# dependencies (omitting demo-only ones like gradio/trimesh/matplotlib/evo). The
# loger.models.pi3 import path needs only einops beyond the base deps; xformers and
# the cuRoPE2D CUDA kernel are guarded optional imports. Initialize the submodule
# before building with:
#   git submodule update --init --recursive
loger = [
  "safetensors>=0.4.0",
  "natsort>=8.4.0",
  "einops>=0.7.0",
  "roma>=1.5.0",
  "accelerate>=0.30.0",
]
gopro = [
  "py-gpmf-parser>=0.1.1,<0.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
train = ["wandb>=0.20.0", "tensorboard>=2.18.0"]
cuda = ["torch>=2.7,<3", "torchvision>=0.22,<1"]
rocm = ["torch>=2.7,<3", "torchvision>=0.22,<1", "pytorch-triton-rocm>=3.0"]
dev = ["pytest>=8.4.0", "ruff>=0.12.0", "mypy>=2.0.0", "types-PyYAML", "types-tqdm"]

[project.urls]
Repository = "https://github.com/EPFL-ECEO/deepreefmap"
Issues = "https://github.com/EPFL-ECEO/deepreefmap/issues"

[project.scripts]
deepreefmap = "deepreefmap.cli.main:app"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

# deepreefmap is a normal package; `loger` (the third_party/LoGeR submodule) is a
# PEP-420 namespace package with no __init__.py at its top levels, so namespaces=true
# is required to discover it, and it's vendored from its own root into the wheel.
[tool.setuptools.packages.find]
where = [".", "third_party/LoGeR"]
include = ["deepreefmap*", "loger*"]
namespaces = true

[tool.setuptools.package-data]
"deepreefmap.resources" = ["configs/*.yaml", "camera_profiles/*.json", "*.png", "fonts/*.ttf", "fonts/*.txt"]

[tool.uv]
conflicts = [
  [{ extra = "cuda" }, { extra = "rocm" }],
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["third_party"]

[tool.mypy]
python_version = "3.10"
exclude = ["deepreefmap/mapping/scsfmlearner/training/"]

[[tool.mypy.overrides]]
module = [
  "open3d.*",
  "sklearn.*",
  "numcodecs.*",
  "zarr.*",
  "torchvision.*",
  "pyvistaqt.*",
  "vtk.*",
  "loger.*",
  "py_gpmf_parser.*",
]
ignore_missing_imports = true
