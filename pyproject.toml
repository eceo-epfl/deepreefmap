[project]
name = "deepreefmap"
version = "1.0.1"
description = "Modular framework for semantic 3D mapping of coral reefs from videos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Jonathan Sauder" },
  { name = "Hugues Sibille", email = "hugues.sibille@epfl.ch" },
]
keywords = ["coral reefs", "semantic mapping", "3d reconstruction", "computer vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.10.0.84",
  "imageio[ffmpeg]>=2.37.3",
  "typer>=0.25.1",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.0",
  "open3d>=0.18.0",
  "transformers>=5.8.0",
  "huggingface_hub>=1.14.0",
  # torch >=2.7 is required by transformers 5.x (string-typed torch.library.custom_op
  # annotations). Modern torch wheels bundle CUDA runtime libs, so NVIDIA drivers
  # >=R525 (CUDA 12.x baseline) on target machines work without manual index pinning.
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  # Upper-bounded so the dual-API fallback in deepreefmap.camera.colmap_calibration
  # (ImageReaderOptions.single_camera vs pycolmap.CameraMode.SINGLE) stays the
  # documented contract; bump after retesting calibrate against a new major.
  "pycolmap>=4.0.4,<5.0",
  "PySide6>=6.7,<7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "tqdm>=4.67.3",
]

[project.optional-dependencies]
# LoGeR upstream (https://github.com/Junyi42/LoGeR) is a research repo with no
# pyproject.toml/setup.py, so we cannot pip-install it. Instead, the LoGeR
# backend imports it directly from third_party/LoGeR via sys.path. This extra
# pulls in LoGeR's *runtime* dependencies (omitting demo-only ones like
# gradio/trimesh/matplotlib/evo). Initialize the submodule with:
#   git submodule update --init --recursive
loger = [
  "safetensors>=0.4.0",
  "natsort>=8.4.0",
  "einops>=0.7.0",
  "roma>=1.5.0",
  "accelerate>=0.30.0",
]
gopro = [
  "py-gpmf-parser>=0.1.1,<0.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
train = ["wandb>=0.20.0", "tensorboard>=2.18.0"]
dev = ["pytest>=8.4.0", "ruff>=0.12.0", "mypy>=2.0.0"]

[project.urls]
Repository = "https://github.com/EPFL-ECEO/deepreefmap"
Issues = "https://github.com/EPFL-ECEO/deepreefmap/issues"

[project.scripts]
deepreefmap = "deepreefmap.cli.main:app"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepreefmap*"]

[tool.setuptools.package-data]
"deepreefmap.resources" = ["configs/*.yaml", "camera_profiles/*.json", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["third_party"]
