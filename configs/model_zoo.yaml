    # Coralscapes V1 (39 classes)
    - coralscapes-vit-s-dpt
    - coralscapes-vit-b-dpt
    - coralscapes-vit-l-dpt
    - segformer-b2
    - segformer-b5
    # CoralscapesV2 (39 classes)
    - coralscapesv2-vit-b-dpt
    - coralscapesv2-vit-l-dpt
    - coralscapesv2-segformer-b5
    # CoralscapesV2 (95 fine-grained classes)
    - coralscapesv2-vit-b-dpt-95
    - coralscapesv2-vit-l-dpt-95
    - coralscapesv2-segformer-b5-95

mapping:
