# Run settings used by survey mode. Per-pass values (transect length, time trim)
# come from the survey database, never from here. To override on one machine,
# copy this file to <user data dir>/deepreefmap/survey_preset.yaml.
schema_version: 2
fps: 5
segmentation_name: coralscapes-vit-b-dpt
mapping_name: loger_star
camera_profile_name: gopro_hero_10
transect_crop_width: 1.0
enable_tsdf: false
skip_segmentation: false
# Null processing size means follow the segmentation model's native size, which
# is what the resolution preset recomputes when the model changes. Only a
# Custom preset pins actual numbers here.
resolution_preset: Native
processing_width: null
processing_height: null
preprocess_batch_size: 4
grid_bins: 2000
require_gravity_telemetry: false
replacement_radius_factor: 0.0
replacement_radius_estimation_frames: 30
replacement_radius_override: 0.0
loger_window_size: 32
loger_overlap_size: 3
loger_model_path: ''
refine_intrinsics_from_mapper: false
scs_target_width: 512
scs_target_height: 256
scs_checkpoint_path: ''
