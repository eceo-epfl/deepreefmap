# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # GitHub Actions referenced from .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies in pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    ignore:
      # Torch is pinned to exact +local wheels per backend in pyproject.toml; bump by
      # hand after retesting (the PyPI default is CUDA 13 and breaks older drivers).
      - dependency-name: "torch"
      - dependency-name: "torchvision"
    groups:
      python-runtime:
        dependency-type: "production"
        patterns: ["*"]
      python-dev:
        dependency-type: "development"
        patterns: ["*"]