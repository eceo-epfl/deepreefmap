name: E2E

# The real-binary update test builds two binaries and provisions their
# environments. Runner storage is ephemeral (discarded when the job ends), so
# the cost is job minutes only; it runs per push/PR plus tags and on demand, in
# a job separate from the release so it never blocks publishing.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-method:
    name: update method (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Two coexisting environments peak around 16 GB; a stock runner has ~21 GB
      # free on /. Reclaim preinstalled toolchains we don't use so provisioning
      # can't hit "no space left on device".
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Qt/OpenGL runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libdbus-1-3 libxkbcommon0 libxcb-cursor0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run update-method e2e
        run: bash tests/e2e/update_e2e.sh
