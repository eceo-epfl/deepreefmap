name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Branch pushes produce downloadable artifacts only; a GitHub Release is cut
# solely from v* tags (the release job below). Cancel superseded runs on the
# same ref — a tag has a unique ref, so tag→release builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: deepreefmap-linux-x64
            ext: ""
            filetype: ELF
          - os: windows-latest
            artifact: deepreefmap-windows-x64
            ext: ".exe"
            filetype: ""
          - os: macos-latest
            artifact: deepreefmap-macos-arm64
            ext: ""
            filetype: Mach-O

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The build vendors LoGeR's `loger` package from this submodule into
          # the wheel (see pyproject [tool.setuptools.packages.find]).
          submodules: recursive

      # On tag builds the artifact is labelled from the tag, but PyApp embeds the
      # wheel version from pyproject — fail fast if they disagree so a release can't
      # ship a binary whose internal version differs from its tag.
      - name: Assert tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_ver="${GITHUB_REF#refs/tags/v}"
          proj_ver=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag_ver" != "$proj_ver" ]; then
            echo "::error::tag v$tag_ver does not match pyproject version $proj_ver"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Compute artifact label
        id: label
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # build.sh takes the output artifact name as $1; build.ps1 hardcodes the
      # windows name. `shell:` can't reference the matrix context, so split by OS.
      - name: Build PyApp binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh ${{ matrix.artifact }}

      - name: Build PyApp binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Label binary
        shell: bash
        run: |
          mv "dist/${{ matrix.artifact }}${{ matrix.ext }}" \
             "dist/${{ matrix.artifact }}-${{ steps.label.outputs.value }}${{ matrix.ext }}"

      - name: Verify binary
        shell: bash
        run: |
          f="dist/${{ matrix.artifact }}-${{ steps.label.outputs.value }}${{ matrix.ext }}"
          test -f "$f"
          # POSIX binaries: assert the executable bit and the expected object format.
          # Windows (empty filetype) skips this — Git Bash has no reliable `file`.
          if [ -n "${{ matrix.filetype }}" ]; then
            test -x "$f"
            file "$f" | grep -q "${{ matrix.filetype }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.label.outputs.value }}
          path: dist/${{ matrix.artifact }}-${{ steps.label.outputs.value }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Resolve version label
        id: label
        shell: bash
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deepreefmap-*-${{ steps.label.outputs.value }}
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deepreefmap-linux-x64-${{ steps.label.outputs.value }}
            dist/deepreefmap-windows-x64-${{ steps.label.outputs.value }}.exe
            dist/deepreefmap-macos-arm64-${{ steps.label.outputs.value }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
