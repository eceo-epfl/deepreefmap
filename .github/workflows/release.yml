name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compute artifact label
        id: label
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PyApp binary
        run: bash scripts/build.sh

      - name: Label binary
        run: mv dist/deepreefmap-linux-x64 dist/deepreefmap-linux-x64-${{ steps.label.outputs.value }}

      - name: Smoke-test binary
        run: ./dist/deepreefmap-linux-x64-${{ steps.label.outputs.value }} --help

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepreefmap-linux-x64-${{ steps.label.outputs.value }}
          path: dist/deepreefmap-linux-x64-${{ steps.label.outputs.value }}
          if-no-files-found: error

  build-windows:
    name: Build windows-x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compute artifact label
        id: label
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PyApp binary
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Label binary
        shell: pwsh
        run: Move-Item dist\deepreefmap-windows-x64.exe "dist\deepreefmap-windows-x64-${{ steps.label.outputs.value }}.exe"

      - name: Smoke-test binary
        shell: pwsh
        run: .\dist\deepreefmap-windows-x64-${{ steps.label.outputs.value }}.exe --help

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepreefmap-windows-x64-${{ steps.label.outputs.value }}
          path: dist/deepreefmap-windows-x64-${{ steps.label.outputs.value }}.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve version label
        id: label
        shell: bash
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: deepreefmap-linux-x64-${{ steps.label.outputs.value }}
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: deepreefmap-windows-x64-${{ steps.label.outputs.value }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deepreefmap-linux-x64-${{ steps.label.outputs.value }}
            dist/deepreefmap-windows-x64-${{ steps.label.outputs.value }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
