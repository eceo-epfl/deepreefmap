name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build PyApp binary
        run: bash build.sh

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepreefmap-linux-x64
          path: dist/deepreefmap-linux-x64
          if-no-files-found: error

  build-windows:
    name: Build windows-x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build PyApp binary
        shell: pwsh
        run: ./build.ps1

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepreefmap-windows-x64
          path: dist/deepreefmap-windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: deepreefmap-linux-x64
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: deepreefmap-windows-x64
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deepreefmap-linux-x64
            dist/deepreefmap-windows-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
